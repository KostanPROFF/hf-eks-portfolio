apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference
  namespace: inference
spec:
  selector:
    matchLabels: {app: inference}
  endpoints:
    - port: http
      path: /metrics/
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inference
  namespace: inference
spec:
  groups:
    - name: inference
      rules:
        - alert: InferenceUnavailable
          expr: absent(up{namespace="inference",service="inference"}) or max(up{namespace="inference",service="inference"}) == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: No healthy inference scrape targets
        - alert: InferenceErrors
          expr: sum(rate(inference_requests_total{outcome="error"}[5m])) / clamp_min(sum(rate(inference_requests_total[5m])), 0.001) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: More than 5 percent inference failures
